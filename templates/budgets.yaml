# Line budgets per discovery file.
# Purpose: keep every file a skeleton, not a dump. An assistant that keeps
# writing past the budget is a signal the content belongs in _sources/,
# not here.
#
# What happens when a file goes over budget:
# the excess moves to _sources/ (a dated appendix, a versioned copy,
# whatever fits the material). It is NEVER deleted. Budgets protect
# readability, not history.
#
# hard: true means the budget takes no exception. Anything else is a
# guideline: going over it once in a while is fine if the content earns
# it, but treat it as a signal to trim.
#
# _sources/ and _system/ carry no budget: that's where the long and the
# raw live, on purpose.

budgets:
  README.md:
    lines: 60
    hard: false
  challenge.md:
    lines: 150
    hard: false
  who-to-talk-to.md:
    lines: 150
    hard: false
  recruiting.md:
    lines: 150
    hard: false
  field-kit/cheatsheet.md:
    lines: 40
    hard: true
  field-kit/guide.md:
    lines: 120
    hard: false
  field-kit/modules.md:
    lines: 80
    hard: false
  field-kit/checklist.md:
    lines: 80
    hard: false
  field-kit/observation.md:
    lines: 80
    hard: false
  findings.md:
    lines: 150
    hard: false
  principles.md:
    lines: 150
    hard: false
