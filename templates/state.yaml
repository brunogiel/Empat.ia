method: design-empathy-ai
version: 3
project_name: ""
created_at: ""
updated_at: ""
# Working language for every document in discovery/. Set at init (--lang).
# Every file is WRITTEN in this language by the assistant when the file is born,
# not only the conversation. The repository stays in English; your folder does not.
language: ""
guide: guide
current_phase: 1
current_step: start
current_status: not_started
valid_statuses:
  - not_started
  - capturing
  - drafted
  - validated
  - advanced_with_assumptions
recommended_action: Deepen
recommended_reason: "Complete initial alignment before moving forward."
industry: ""
is_tech_project: null
active_agents:
  - guide
available_agents:
  - guide
  - qualitative-researcher
  - deep-market-researcher
  - uxer
  - sociologist
  - economist
  - growth
  - artist
  - philosopher
  - technologist
  - data-scientist
  - industry-expert
  - sme-owner
  - cab-driver
# The editor is not a council agent and is never convened. It runs at every gate:
# it distills, routes misplaced content, empties notes.md and trims by the budgets
# in budgets.yaml. It never deletes.
editor: on

# --- How to read this file -------------------------------------------------
#
# Hard rule: a step with a gate cannot be closed without updating 'status' to
# 'drafted', 'validated' or 'advanced_with_assumptions', and updating updated_at.
#
# This file is the only place the project STATE lives. No other document repeats it.
#
# The folder listing answers a DIFFERENT question, and that is why the two never
# collide: the listing tells you HOW FAR you got (if 3-guide/ exists, you entered
# phase 3), this file tells you WHAT STATE each step is in. A file is born when you
# ENTER its step, not when you close it, so existence never means "done".
#
# 'file' is what the assistant creates when the step starts: from the template of
# the same name, written in `language`, pre-filled with what the project already
# knows. Nothing is created at install except phase 1's brief.
#
# 'on_demand: true' means the file is born only if the project needs it. A project
# that runs no observation never sees an observation file. Phases 6 and 7 are
# on demand as a whole. Phase 8 is not: every plan closes with the report.
#
# The ORDER of the work comes from the 'plan:' block at the bottom, not from the
# folder numbers. The numbers are names that stay put; the plan says which pieces
# this project uses, in what order, and who does each one.
# ---------------------------------------------------------------------------

phases:
  1:
    name: desk-research
    folder: 1-desk-research
    steps: [start, design_challenge, market_research, knowledge_base, plan]
  2:
    name: profiling
    folder: 2-profiling
    steps: [profiles, recruiting]
  3:
    name: guide
    folder: 3-guide
    steps: [interview_guide, field_process]
  4:
    name: field
    folder: 4-field
    steps: [interview_capture, observation]
  5:
    name: debrief
    folder: 5-debrief
    steps: [debrief]
  6:
    name: ideation
    folder: 6-ideation
    steps: [ideation]
  7:
    name: validation
    folder: 7-validation
    steps: [validation_guide, validation_capture, validation_debrief]
  8:
    name: report
    folder: 8-report
    steps: [report]

steps:
  start:
    phase: 1
    status: not_started
    file: 1-desk-research/brief.md
    gate: true
  design_challenge:
    phase: 1
    status: not_started
    file: 1-desk-research/brief.md
    gate: true
  market_research:
    phase: 1
    status: not_started
    file: 1-desk-research/market.md
    gate: true
  knowledge_base:
    phase: 1
    status: not_started
    file: 1-desk-research/knowledge.md
    gate: true
  # The plan can run at any moment, not only at the end of phase 1: a project
  # that enters in the middle runs it first, and re-planning is the same step.
  # It writes the '## Plan' section of the brief and the 'plan:' block below.
  plan:
    phase: 1
    status: not_started
    file: 1-desk-research/brief.md
    gate: true
  profiles:
    phase: 2
    status: not_started
    file: 2-profiling/profiles.md
    gate: true
  recruiting:
    phase: 2
    status: not_started
    file: 2-profiling/recruiting.md
    gate: false
  interview_guide:
    phase: 3
    status: not_started
    file: 3-guide/guide.md
    gate: true
  field_process:
    phase: 3
    status: not_started
    file: 3-guide/process.md
    gate: false
  interview_capture:
    phase: 4
    status: not_started
    file: 4-field/0-index.md + 4-field/feedback/0-README.md + _engine/evidence.md
    gate: true
  observation:
    phase: 4
    status: not_started
    file: 4-field/0-observation-plan.md
    gate: false
    on_demand: true
  debrief:
    phase: 5
    status: not_started
    file: 5-debrief/findings.md + 5-debrief/principles.md
    gate: true
  ideation:
    phase: 6
    status: not_started
    file: 6-ideation/concepts.md
    gate: true
    on_demand: true
  validation_guide:
    phase: 7
    status: not_started
    file: 7-validation/tasks.md
    gate: true
    on_demand: true
  validation_capture:
    phase: 7
    status: not_started
    file: 7-validation/0-index.md + _engine/evidence.md
    gate: true
    on_demand: true
  validation_debrief:
    phase: 7
    status: not_started
    file: 7-validation/findings.md
    gate: true
    on_demand: true
  report:
    phase: 8
    status: not_started
    file: 8-report/summary.md
    gate: true

interviews:
  target: 10
  done: 0
  # Field signal. From phase 4 on, if 'done' is still 0 and more than
  # 'stale_after_days' have passed since created_at, the Guide says so before
  # anything else and asks what is blocking the first interview.
  # Preparation is not evidence. The method does not replace fieldwork.
  stale_after_days: 7
  # Unprocessed transcripts block nothing, but the Guide raises them before
  # offering Advance into phase 5. Synthesising over unprocessed material is
  # the one thing the method already forbids.
  unprocessed: 0

# Validation sessions (VAL-00X, phase 7), counted apart from the interviews above.
validations:
  target: 0
  done: 0
  unprocessed: 0

# --- The plan ---------------------------------------------------------------
# The brief closes with a plan, and this block is its machine-readable twin.
# An ordered list: THE ORDER IS THE PLAN'S, NOT THE FOLDER NUMBER'S.
#
#   piece   a phase name (desk-research, field, ...) or a step key
#   status  planned | skipped | external | done
#             skipped   we do not do it, and the assumption is logged in decisions.md
#             external  someone outside does it; 'note' links their result
#             done      finished
#   owner   who does it
#   note    one line: the assumption of a skipped piece, or the link of an
#           external one
#
# This is a starting point. The Guide proposes it and the user decides; it is
# never presented as already decided. The status line counts every piece that is
# not skipped, and an external piece counts but never blocks.
plan:
  - {piece: desk-research, status: planned, owner: "", note: ""}
  - {piece: profiling,     status: planned, owner: "", note: ""}
  - {piece: guide,         status: planned, owner: "", note: ""}
  - {piece: field,         status: planned, owner: "", note: ""}
  - {piece: debrief,       status: planned, owner: "", note: ""}
  - {piece: ideation,      status: skipped, owner: "", note: ""}
  - {piece: validation,    status: skipped, owner: "", note: ""}
  - {piece: report,        status: planned, owner: "", note: ""}
